# Plain HTTP config — used ONLY before TLS certificates are provisioned.
# Switch to jwtdecode.conf once Let's Encrypt certs are in place.

server {
    listen 80;
    listen [::]:80;
    server_name jwtdecode.app www.jwtdecode.app _;

    root /usr/share/nginx/html;
    index index.html;

    # ACME challenge for initial cert issuance
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Security headers (no HSTS on plain HTTP)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # No-cache for index.html
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Long-cache for hashed assets
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~ /\. {
        deny all;
    }
}
