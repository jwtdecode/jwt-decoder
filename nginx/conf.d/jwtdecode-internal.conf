# HTTP-only internal config — host nginx terminates TLS and proxies to us.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Trust X-Forwarded-* from host nginx
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;

    # Hashed assets — long cache
    location ~* \.(?:js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # All HTML (prerendered routes) — short cache; hashed assets carry the
    # long-lived caching, and a stale page chunk triggers a full reload.
    location ~* \.html$ {
        # /index.html and /<route>/index.html duplicate the clean URLs: 301 them.
        # Matched on $request_uri so the internal `index` lookup for / is untouched.
        if ($request_uri ~ "^/(?:(.*)/)?index\.html(?:\?.*)?$") {
            return 301 /$1;
        }
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA + prerendered routes:
    #   $uri              — exact file (e.g. /assets/foo.js)
    #   $uri/index.html   — prerendered route (avoids the dir-trailing-slash 301
    #                       that `$uri/` would cause via nginx default behaviour)
    #   =404              — return real HTTP 404 for unknown URLs (NOT soft-404
    #                       by silently serving /index.html — that bug let Google
    #                       see infinite duplicates of the homepage).
    # One URL per page: /what-is-a-jwt/ -> 301 /what-is-a-jwt (canonical form).
    # Relative Location so the redirect stays on the public https host.
    absolute_redirect off;
    location ~ ^/(.+)/$ {
        return 301 /$1$is_args$args;
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Prerendered 404 body served WITH HTTP 404 status. Marked internal so the
    # URL /404.html is not directly fetchable by clients (no 200-OK back-door).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # RFC 9116 security.txt (the dotfile deny below would otherwise 403 it)
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
